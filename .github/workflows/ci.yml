name: CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to test (e.g. v0.8.8)"
        required: true
        type: string

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Setup — install fcoreutils, generate data, measure sizes (runs once)
  # ─────────────────────────────────────────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fcoreutils ${{ inputs.version }}
        run: bash scripts/install_from_github.sh --version ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install hyperfine
        run: sudo apt-get install -y hyperfine

      - name: Generate test data
        run: bash tests/helpers/generate_test_data.sh

      - name: Measure binary sizes
        run: |
          python3 - <<'EOF'
          import json, os, shutil, subprocess

          INSTALL_DIR = os.path.expanduser("~/.local/bin")

          tools = []
          if os.path.isdir(INSTALL_DIR):
              for name in sorted(os.listdir(INSTALL_DIR)):
                  if name.startswith("f") and os.path.isfile(os.path.join(INSTALL_DIR, name)):
                      tools.append(name[1:])

          rows = {}
          for tool in tools:
              f_path = os.path.join(INSTALL_DIR, "f" + tool)
              gnu_path = shutil.which(tool)
              f_size = os.path.getsize(f_path) if os.path.exists(f_path) else None
              if f_size is None:
                  continue
              rows[tool] = {
                  "f_bytes": f_size,
                  "gnu_bytes": os.path.getsize(gnu_path) if gnu_path else None,
              }

          out = {
              "type": "sizes",
              "platform": subprocess.check_output(["uname", "-sm"]).decode().strip(),
              "sizes": rows,
          }

          os.makedirs("results", exist_ok=True)
          with open("results/sizes.json", "w") as f:
              json.dump(out, f, indent=2)
          print(f"Binary sizes measured for {len(rows)} tools")
          EOF

      - name: Package setup artifact
        run: |
          mkdir -p ci-setup/bin
          # Copy fcoreutils binaries
          cp -a "$HOME/.local/bin"/* ci-setup/bin/
          # Copy hyperfine binary
          cp "$(which hyperfine)" ci-setup/bin/hyperfine
          # Tar test data to avoid artifact filename restrictions
          # (special_names/ contains files with quotes and other chars forbidden by NTFS)
          chmod -R u+r /tmp/fcoreutils-test-data/
          tar cf ci-setup/test-data.tar -C /tmp fcoreutils-test-data

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-linux
          path: ci-setup/
          compression-level: 6

      - name: Upload sizes
        uses: actions/upload-artifact@v4
        with:
          name: sizes
          path: results/sizes.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Compatibility tests — one per tool (107 parallel jobs)
  # ─────────────────────────────────────────────────────────────────────────────
  compat:
    name: Compat/${{ matrix.tool }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - arch
          - b2sum
          - base32
          - base64
          - basename
          - basenc
          - cat
          - chcon
          - chgrp
          - chmod
          - chown
          - chroot
          - cksum
          - comm
          - cp
          - csplit
          - cut
          - date
          - dd
          - df
          - dir
          - dircolors
          - dirname
          - du
          - echo
          - env
          - expand
          - expr
          - factor
          - "false"
          - fmt
          - fold
          - groups
          - head
          - hostid
          - id
          - install
          - join
          - kill
          - link
          - ln
          - logname
          - ls
          - md5sum
          - mkdir
          - mkfifo
          - mknod
          - mktemp
          - mv
          - nice
          - nl
          - nohup
          - nproc
          - numfmt
          - od
          - paste
          - pathchk
          - pinky
          - pr
          - printenv
          - printf
          - ptx
          - pwd
          - readlink
          - realpath
          - rev
          - rm
          - rmdir
          - runcon
          - seq
          - sha1sum
          - sha224sum
          - sha256sum
          - sha384sum
          - sha512sum
          - shred
          - shuf
          - sleep
          - sort
          - split
          - stat
          - stdbuf
          - stty
          - sum
          - sync
          - tac
          - tail
          - tee
          - "test"
          - timeout
          - touch
          - tr
          - "true"
          - truncate
          - tsort
          - tty
          - uname
          - unexpand
          - uniq
          - unlink
          - uptime
          - users
          - vdir
          - wc
          - who
          - whoami
          - "yes"
    steps:
      - uses: actions/checkout@v4

      - name: Download setup artifact
        uses: actions/download-artifact@v4
        with:
          name: setup-linux
          path: ci-setup

      - name: Restore environment
        run: |
          mkdir -p "$HOME/.local/bin"
          cp -a ci-setup/bin/* "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin"/*
          # Extract test data from tarball
          tar xf ci-setup/test-data.tar -C /tmp
          # Restore permission test fixtures
          [[ -f /tmp/fcoreutils-test-data/unreadable.txt ]] && chmod 000 /tmp/fcoreutils-test-data/unreadable.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install test locales
        run: |
          sudo sed -i 's/^# fr_FR.UTF-8 UTF-8/fr_FR.UTF-8 UTF-8/' /etc/locale.gen
          sudo sed -i 's/^# zh_CN.GB18030 GB18030/zh_CN.GB18030 GB18030/' /etc/locale.gen
          sudo locale-gen

      - name: Run compatibility test
        run: bash tests/commands/run_tool.sh ${{ matrix.tool }}
        continue-on-error: true
        env:
          RESULTS_DIR: ${{ github.workspace }}/results

      - name: Upload result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-${{ matrix.tool }}
          path: results/${{ matrix.tool }}_results.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Benchmarks — one per tool (107 parallel jobs)
  # ─────────────────────────────────────────────────────────────────────────────
  bench:
    name: Bench/${{ matrix.tool }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - arch
          - b2sum
          - base32
          - base64
          - basename
          - basenc
          - cat
          - chcon
          - chgrp
          - chmod
          - chown
          - chroot
          - cksum
          - comm
          - cp
          - csplit
          - cut
          - date
          - dd
          - df
          - dir
          - dircolors
          - dirname
          - du
          - echo
          - env
          - expand
          - expr
          - factor
          - "false"
          - fmt
          - fold
          - groups
          - head
          - hostid
          - id
          - install
          - join
          - kill
          - link
          - ln
          - logname
          - ls
          - md5sum
          - mkdir
          - mkfifo
          - mknod
          - mktemp
          - mv
          - nice
          - nl
          - nohup
          - nproc
          - numfmt
          - od
          - paste
          - pathchk
          - pinky
          - pr
          - printenv
          - printf
          - ptx
          - pwd
          - readlink
          - realpath
          - rev
          - rm
          - rmdir
          - runcon
          - seq
          - sha1sum
          - sha224sum
          - sha256sum
          - sha384sum
          - sha512sum
          - shred
          - shuf
          - sleep
          - sort
          - split
          - stat
          - stdbuf
          - stty
          - sum
          - sync
          - tac
          - tail
          - tee
          - "test"
          - timeout
          - touch
          - tr
          - "true"
          - truncate
          - tsort
          - tty
          - uname
          - unexpand
          - uniq
          - unlink
          - uptime
          - users
          - vdir
          - wc
          - who
          - whoami
          - "yes"
    steps:
      - uses: actions/checkout@v4

      - name: Download setup artifact
        uses: actions/download-artifact@v4
        with:
          name: setup-linux
          path: ci-setup

      - name: Restore environment
        run: |
          mkdir -p "$HOME/.local/bin"
          cp -a ci-setup/bin/* "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin"/*
          # Extract test data from tarball
          tar xf ci-setup/test-data.tar -C /tmp
          # Restore permission test fixtures
          [[ -f /tmp/fcoreutils-test-data/unreadable.txt ]] && chmod 000 /tmp/fcoreutils-test-data/unreadable.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run benchmark
        run: |
          mkdir -p results
          script="tests/benchmarks/bench_${{ matrix.tool }}.sh"
          if [[ -f "$script" ]]; then
            bash "$script"
          else
            echo '{"tool":"${{ matrix.tool }}","status":"NO_BENCHMARK"}' > "results/${{ matrix.tool }}_benchmark.json"
          fi
        continue-on-error: true
        env:
          RESULTS_DIR: ${{ github.workspace }}/results

      - name: Upload result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.tool }}
          path: results/${{ matrix.tool }}_benchmark.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Functional tests — 4-platform matrix (sequential per platform)
  # ─────────────────────────────────────────────────────────────────────────────
  functional:
    name: Functional (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            result_name: linux_aarch64
            run_full_tests: "true"

          - name: macos-arm64
            runner: macos-latest
            triple: aarch64-apple-darwin
            result_name: darwin_arm64
            run_full_tests: "true"

          - name: windows-x86_64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
            result_name: windows_x86_64
            run_full_tests: "true"

          - name: windows-arm64
            runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
            result_name: windows_arm64
            run_full_tests: "false"

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install fcoreutils ${{ inputs.version }}
        id: install
        run: |
          if bash scripts/install_from_github.sh --version ${{ inputs.version }}; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: Binary not available for ${{ matrix.triple }}, will mark as skipped"
          fi
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add install dir to PATH
        if: steps.install.outputs.installed == 'true'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write skipped result (no binary available)
        if: steps.install.outputs.installed != 'true'
        run: |
          mkdir -p results/compatibility/${{ inputs.version }}
          python3 - <<'EOF'
          import json, os
          result = {
              "skipped": True,
              "reason": "no binary available for ${{ matrix.triple }}",
              "platform": "${{ matrix.triple }}",
              "type": "compatibility",
          }
          os.makedirs("results/compatibility/${{ inputs.version }}", exist_ok=True)
          with open("results/compatibility/${{ inputs.version }}/${{ matrix.result_name }}.json", "w") as f:
              json.dump(result, f, indent=2)
          print("Wrote skipped result.")
          EOF

      - name: Generate test data
        if: steps.install.outputs.installed == 'true' && matrix.run_full_tests == 'true'
        run: bash tests/helpers/generate_test_data.sh

      - name: Run compatibility tests
        if: steps.install.outputs.installed == 'true' && matrix.run_full_tests == 'true'
        run: bash tests/commands/run_all.sh
        continue-on-error: true
        env:
          RESULTS_DIR: ${{ github.workspace }}/results

      - name: Copy results to versioned path
        if: steps.install.outputs.installed == 'true' && matrix.run_full_tests == 'true'
        run: |
          mkdir -p results/compatibility/${{ inputs.version }}
          cp results/compatibility_results.json \
             results/compatibility/${{ inputs.version }}/${{ matrix.result_name }}.json

      - name: Smoke test (quick sanity check, full tests skipped)
        if: steps.install.outputs.installed == 'true' && matrix.run_full_tests == 'false'
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "Running smoke test for ${{ matrix.name }}"
          INSTALL_DIR="$HOME/.local/bin"
          pass=0; fail=0; crash=0
          for tool in fwc fsort fcut ftr funiq ftac fbase64 fsha256sum fhead ftail fcat; do
            bin="$INSTALL_DIR/$tool"
            if [[ ! -x "$bin" ]]; then
              bin="$INSTALL_DIR/${tool}.exe"
            fi
            if [[ ! -x "$bin" ]]; then
              echo "  MISSING: $tool"
              fail=$((fail+1))
              continue
            fi
            if "$bin" --version >/dev/null 2>&1 || "$bin" --help >/dev/null 2>&1; then
              echo "  OK: $tool"
              pass=$((pass+1))
            else
              echo "  CRASH: $tool (exit $?)"
              crash=$((crash+1))
            fi
          done
          echo "Smoke test: $pass OK, $fail missing, $crash crashed"

          mkdir -p "results/compatibility/${{ inputs.version }}"
          python3 - <<'PYEOF'
          import json, os
          result = {
              "skipped": False,
              "smoke_only": True,
              "reason": "x86_64 binary under ARM64 emulation — full test suite skipped to avoid SIMD crashes",
              "platform": "${{ matrix.triple }}",
              "type": "compatibility",
              "summary": {
                  "total_tests": 0, "passed": 0, "failed": 0, "skipped": 0,
                  "tools_tested": 0, "tools_skipped": 0
              },
              "tools": {}
          }
          path = "results/compatibility/${{ inputs.version }}/${{ matrix.result_name }}.json"
          with open(path, "w") as f:
              json.dump(result, f, indent=2)
          print(f"Wrote smoke-only result to {path}")
          PYEOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: functional-${{ matrix.name }}
          path: results/compatibility/${{ inputs.version }}/${{ matrix.result_name }}.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Assembly Setup — install nasm, clone, build assembly tools
  # ─────────────────────────────────────────────────────────────────────────────
  asm-setup:
    name: ASM Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm and binutils
        run: sudo apt-get update -qq && sudo apt-get install -y nasm binutils

      - name: Clone and build assembly tools
        run: |
          bash scripts/install_assembly.sh \
            --version ${{ inputs.version }} \
            --install-dir "$HOME/.local/bin/asm"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install hyperfine
        run: sudo apt-get install -y hyperfine

      - name: Generate test data
        run: bash tests/helpers/generate_test_data.sh

      - name: Measure assembly binary sizes
        run: |
          python3 - <<'EOF'
          import json, os, shutil, subprocess

          ASM_DIR = os.path.expanduser("~/.local/bin/asm")
          asm_tools = {
              "cat": "fcat", "seq": "fseq", "nl": "fnl", "expand": "fexpand",
              "unexpand": "funexpand", "fold": "ffold", "uniq": "funiq",
              "od": "fod", "sort": "fsort", "false": "ffalse"
          }

          sizes = {}
          for tool, binary in sorted(asm_tools.items()):
              asm_path = os.path.join(ASM_DIR, binary)
              gnu_path = shutil.which(tool)
              if os.path.exists(asm_path):
                  sizes[tool] = {
                      "asm_bytes": os.path.getsize(asm_path),
                      "gnu_bytes": os.path.getsize(gnu_path) if gnu_path else None,
                  }

          out = {
              "type": "asm_sizes",
              "platform": subprocess.check_output(["uname", "-sm"]).decode().strip(),
              "sizes": sizes,
          }

          os.makedirs("results", exist_ok=True)
          with open("results/asm_sizes.json", "w") as f:
              json.dump(out, f, indent=2)
          print(f"Assembly binary sizes measured for {len(sizes)} tools")
          EOF

      - name: Package assembly setup artifact
        run: |
          mkdir -p ci-asm-setup/bin
          cp -a "$HOME/.local/bin/asm"/* ci-asm-setup/bin/ 2>/dev/null || true
          # Copy hyperfine
          cp "$(which hyperfine)" ci-asm-setup/bin/hyperfine
          # Tar test data
          chmod -R u+r /tmp/fcoreutils-test-data/
          tar cf ci-asm-setup/test-data.tar -C /tmp fcoreutils-test-data
          # Save the clone path for tests that need the source tree
          # (compat/security tests need the test scripts from the repo)

      - name: Clone fcoreutils for test scripts
        run: |
          git clone --depth 1 --branch ${{ inputs.version }} \
            https://github.com/AiBrush/fcoreutils.git /tmp/fcoreutils-src 2>/dev/null || \
          git clone --depth 1 \
            https://github.com/AiBrush/fcoreutils.git /tmp/fcoreutils-src
          # Tar just the assembly test scripts
          tar cf ci-asm-setup/asm-tests.tar -C /tmp/fcoreutils-src assembly/

      - name: Upload assembly setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: asm-setup
          path: ci-asm-setup/
          compression-level: 6

      - name: Upload assembly sizes
        uses: actions/upload-artifact@v4
        with:
          name: asm-sizes
          path: results/asm_sizes.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 6: Assembly Compat Tests — per-tool GNU compatibility (10 parallel jobs)
  # ─────────────────────────────────────────────────────────────────────────────
  asm-compat:
    name: ASM-Compat/${{ matrix.tool }}
    needs: asm-setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - cat
          - seq
          - nl
          - expand
          - unexpand
          - fold
          - uniq
          - od
          - sort
          - "false"
    steps:
      - uses: actions/checkout@v4

      - name: Download assembly setup artifact
        uses: actions/download-artifact@v4
        with:
          name: asm-setup
          path: ci-asm-setup

      - name: Restore assembly environment
        run: |
          mkdir -p "$HOME/.local/bin/asm"
          # Copy assembly binaries (exclude hyperfine)
          for f in ci-asm-setup/bin/*; do
            fname=$(basename "$f")
            if [[ "$fname" != "hyperfine" ]]; then
              cp "$f" "$HOME/.local/bin/asm/"
            fi
          done
          chmod +x "$HOME/.local/bin/asm"/*
          # Extract test data
          tar xf ci-asm-setup/test-data.tar -C /tmp
          # Extract assembly test scripts
          mkdir -p /tmp/fcoreutils-src
          tar xf ci-asm-setup/asm-tests.tar -C /tmp/fcoreutils-src

      - name: Run assembly compatibility test
        run: |
          TOOL="${{ matrix.tool }}"
          BINARY="f${TOOL}"
          BIN_PATH="$HOME/.local/bin/asm/$BINARY"
          TEST_SCRIPT="/tmp/fcoreutils-src/assembly/$TOOL/tests/run_tests.sh"

          mkdir -p results

          if [[ ! -x "$BIN_PATH" ]]; then
            echo "Assembly binary $BINARY not found at $BIN_PATH"
            echo "{\"tool\":\"$TOOL\",\"binary\":\"$BINARY\",\"status\":\"SKIP\",\"reason\":\"binary not found\",\"passed\":0,\"failed\":0,\"total\":0}" \
              > "results/asm_compat_${TOOL}.json"
            exit 0
          fi

          if [[ ! -f "$TEST_SCRIPT" ]]; then
            echo "Test script not found at $TEST_SCRIPT"
            echo "{\"tool\":\"$TOOL\",\"binary\":\"$BINARY\",\"status\":\"SKIP\",\"reason\":\"no test script\",\"passed\":0,\"failed\":0,\"total\":0}" \
              > "results/asm_compat_${TOOL}.json"
            exit 0
          fi

          echo "Running compatibility tests for assembly $BINARY..."
          test_output=$(timeout 300 bash "$TEST_SCRIPT" "$BIN_PATH" 2>&1) || true
          echo "$test_output"

          # Parse results
          passed=0; failed=0; total=0
          if echo "$test_output" | grep -q "Results:"; then
            passed=$(echo "$test_output" | grep "Results:" | sed -n 's/.*Results: \([0-9]*\) passed.*/\1/p')
            failed=$(echo "$test_output" | grep "Results:" | sed -n 's/.*, \([0-9]*\) failed.*/\1/p')
            total=$((passed + failed))
          fi

          # Fallback: count ALL TESTS PASSED / FAILED lines
          if [[ "$total" -eq 0 ]]; then
            if echo "$test_output" | grep -q "ALL TESTS PASSED"; then
              passed=1; total=1
            elif echo "$test_output" | grep -q "TESTS FAILED"; then
              failed=1; total=1
            fi
          fi

          cat > "results/asm_compat_${TOOL}.json" <<EOJSON
          {
              "tool": "$TOOL",
              "binary": "$BINARY",
              "status": "tested",
              "passed": $passed,
              "failed": $failed,
              "total": $total,
              "platform": "$(uname -s)_$(uname -m)",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOJSON
        continue-on-error: true
        env:
          RESULTS_DIR: ${{ github.workspace }}/results

      - name: Upload result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asm-compat-${{ matrix.tool }}
          path: results/asm_compat_${{ matrix.tool }}.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 7: Assembly Security Tests — per-tool security validation (10 parallel)
  # ─────────────────────────────────────────────────────────────────────────────
  asm-security:
    name: ASM-Security/${{ matrix.tool }}
    needs: asm-setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - cat
          - seq
          - nl
          - expand
          - unexpand
          - fold
          - uniq
          - od
          - sort
          - "false"
    steps:
      - uses: actions/checkout@v4

      - name: Download assembly setup artifact
        uses: actions/download-artifact@v4
        with:
          name: asm-setup
          path: ci-asm-setup

      - name: Restore assembly environment
        run: |
          mkdir -p "$HOME/.local/bin/asm"
          for f in ci-asm-setup/bin/*; do
            fname=$(basename "$f")
            if [[ "$fname" != "hyperfine" ]]; then
              cp "$f" "$HOME/.local/bin/asm/"
            fi
          done
          chmod +x "$HOME/.local/bin/asm"/*
          tar xf ci-asm-setup/test-data.tar -C /tmp
          mkdir -p /tmp/fcoreutils-src
          tar xf ci-asm-setup/asm-tests.tar -C /tmp/fcoreutils-src

      - name: Run assembly security test
        run: |
          TOOL="${{ matrix.tool }}"
          BINARY="f${TOOL}"
          BIN_PATH="$HOME/.local/bin/asm/$BINARY"
          TEST_SCRIPT="/tmp/fcoreutils-src/assembly/$TOOL/tests/security_tests.py"
          TOOL_DIR="/tmp/fcoreutils-src/assembly/$TOOL"

          mkdir -p results

          if [[ ! -x "$BIN_PATH" ]]; then
            echo "Assembly binary $BINARY not found"
            echo "{\"tool\":\"$TOOL\",\"binary\":\"$BINARY\",\"status\":\"SKIP\",\"reason\":\"binary not found\",\"passed\":0,\"failed\":0,\"skipped\":0,\"total\":0}" \
              > "results/asm_security_${TOOL}.json"
            exit 0
          fi

          if [[ ! -f "$TEST_SCRIPT" ]]; then
            echo "Security test not found at $TEST_SCRIPT"
            echo "{\"tool\":\"$TOOL\",\"binary\":\"$BINARY\",\"status\":\"SKIP\",\"reason\":\"no security test\",\"passed\":0,\"failed\":0,\"skipped\":0,\"total\":0}" \
              > "results/asm_security_${TOOL}.json"
            exit 0
          fi

          echo "Running security tests for assembly $BINARY..."

          # Symlink binary where security_tests.py expects it
          EXPECTED_BIN="$TOOL_DIR/$BINARY"
          created_symlink=false
          if [[ ! -f "$EXPECTED_BIN" ]]; then
            ln -sf "$BIN_PATH" "$EXPECTED_BIN"
            created_symlink=true
          fi

          pushd "$TOOL_DIR" >/dev/null
          test_output=$(timeout 600 python3 tests/security_tests.py 2>&1) || true
          echo "$test_output"
          popd >/dev/null

          if $created_symlink; then
            rm -f "$EXPECTED_BIN"
          fi

          # Parse results from [PASS]/[FAIL]/[SKIP] lines
          passed=$(echo "$test_output" | grep -c '^\[PASS\]' || true)
          failed=$(echo "$test_output" | grep -c '^\[FAIL\]' || true)
          skipped=$(echo "$test_output" | grep -c '^\[SKIP\]' || true)
          total=$((passed + failed + skipped))

          # Try TOTAL: pattern as fallback
          if [[ "$total" -eq 0 ]] && echo "$test_output" | grep -qE "TOTAL:\s+[0-9]"; then
            total=$(echo "$test_output" | grep -oP 'TOTAL:\s+\K[0-9]+' | tail -1)
            passed=$(echo "$test_output" | grep -oP 'PASS:\s+\K[0-9]+' | tail -1)
            failed=$(echo "$test_output" | grep -oP 'FAIL:\s+\K[0-9]+' | tail -1)
            skipped=$(echo "$test_output" | grep -oP 'SKIP:\s+\K[0-9]+' | tail -1)
          fi

          cat > "results/asm_security_${TOOL}.json" <<EOJSON
          {
              "tool": "$TOOL",
              "binary": "$BINARY",
              "status": "tested",
              "passed": ${passed:-0},
              "failed": ${failed:-0},
              "skipped": ${skipped:-0},
              "total": ${total:-0},
              "platform": "$(uname -s)_$(uname -m)",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOJSON
        continue-on-error: true
        env:
          RESULTS_DIR: ${{ github.workspace }}/results

      - name: Upload result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asm-security-${{ matrix.tool }}
          path: results/asm_security_${{ matrix.tool }}.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 8: Assembly Benchmarks — 3-way comparison per tool (9 parallel jobs)
  # ─────────────────────────────────────────────────────────────────────────────
  asm-bench:
    name: ASM-Bench/${{ matrix.tool }}
    needs: [setup, asm-setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - cat
          - seq
          - nl
          - expand
          - unexpand
          - fold
          - uniq
          - od
          - sort
    steps:
      - uses: actions/checkout@v4

      - name: Download Rust setup artifact
        uses: actions/download-artifact@v4
        with:
          name: setup-linux
          path: ci-setup

      - name: Download assembly setup artifact
        uses: actions/download-artifact@v4
        with:
          name: asm-setup
          path: ci-asm-setup

      - name: Restore environment (Rust + ASM + test data)
        run: |
          # Rust fcoreutils
          mkdir -p "$HOME/.local/bin"
          cp -a ci-setup/bin/* "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin"/*
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          # Assembly binaries (separate directory)
          mkdir -p "$HOME/.local/bin/asm"
          for f in ci-asm-setup/bin/*; do
            fname=$(basename "$f")
            if [[ "$fname" != "hyperfine" ]]; then
              cp "$f" "$HOME/.local/bin/asm/"
            fi
          done
          chmod +x "$HOME/.local/bin/asm"/*

          # Extract test data
          tar xf ci-setup/test-data.tar -C /tmp
          [[ -f /tmp/fcoreutils-test-data/unreadable.txt ]] && chmod 000 /tmp/fcoreutils-test-data/unreadable.txt

      - name: Run 3-way benchmark
        run: |
          TOOL="${{ matrix.tool }}"
          BINARY="f${TOOL}"
          GNU_BIN="$TOOL"
          RUST_BIN="$HOME/.local/bin/$BINARY"
          ASM_BIN="$HOME/.local/bin/asm/$BINARY"
          DATA_DIR="/tmp/fcoreutils-test-data"

          mkdir -p results

          # Check binaries
          echo "GNU:  $(which $GNU_BIN 2>/dev/null || echo 'not found')"
          echo "Rust: $RUST_BIN ($(test -x $RUST_BIN && echo 'OK' || echo 'not found'))"
          echo "ASM:  $ASM_BIN ($(test -x $ASM_BIN && echo 'OK' || echo 'not found'))"

          if [[ ! -x "$ASM_BIN" ]]; then
            echo "Assembly binary not found, skipping benchmark"
            echo "{\"tool\":\"$TOOL\",\"status\":\"SKIP\",\"reason\":\"asm binary not found\"}" \
              > "results/asm_bench_${TOOL}.json"
            exit 0
          fi

          BENCH_RESULTS="[]"
          add_result() {
            local entry="$1"
            if [[ "$BENCH_RESULTS" == "[]" ]]; then
              BENCH_RESULTS="[$entry]"
            else
              BENCH_RESULTS="${BENCH_RESULTS%]},${entry}]"
            fi
          }

          run_bench() {
            local name="$1"
            local gnu_cmd="$2"
            local rust_cmd="$3"
            local asm_cmd="$4"

            echo ""
            echo "--- $name ---"

            local json_file
            json_file=$(mktemp /tmp/asm_bench_XXXXXX.json)

            local hf_args=(--warmup 3 --runs 10 --export-json "$json_file")

            # Add available commands
            if command -v "$GNU_BIN" &>/dev/null; then
              hf_args+=(-n "GNU $TOOL" "$gnu_cmd")
            fi
            if [[ -x "$RUST_BIN" ]]; then
              hf_args+=(-n "Rust f$TOOL" "$rust_cmd")
            fi
            if [[ -x "$ASM_BIN" ]]; then
              hf_args+=(-n "ASM f$TOOL" "$asm_cmd")
            fi

            if hyperfine "${hf_args[@]}" 2>&1; then
              local result
              result=$(python3 -c "
          import json
          d = json.load(open('$json_file'))
          entry = {'name': '$name', 'status': 'benchmarked'}
          for r in d.get('results', []):
              cmd = r.get('command', '')
              mean = round(r.get('mean', 0), 6)
              if 'GNU' in cmd: entry['gnu_mean'] = mean
              elif 'Rust' in cmd: entry['rust_mean'] = mean
              elif 'ASM' in cmd: entry['asm_mean'] = mean
          gnu = entry.get('gnu_mean')
          rust = entry.get('rust_mean')
          asm = entry.get('asm_mean')
          if gnu and rust and rust > 0: entry['rust_vs_gnu'] = round(gnu/rust, 1)
          if gnu and asm and asm > 0: entry['asm_vs_gnu'] = round(gnu/asm, 1)
          if rust and asm and asm > 0: entry['asm_vs_rust'] = round(rust/asm, 1)
          print(json.dumps(entry))
          " 2>/dev/null || echo "")

              if [[ -n "$result" ]]; then
                add_result "$result"
              fi
            fi

            rm -f "$json_file"
          }

          # Tool-specific benchmarks
          case "$TOOL" in
            cat)
              run_bench "passthrough 1MB" \
                "$GNU_BIN '$DATA_DIR/text_1m.txt' > /dev/null" \
                "$RUST_BIN '$DATA_DIR/text_1m.txt' > /dev/null" \
                "$ASM_BIN '$DATA_DIR/text_1m.txt' > /dev/null"
              if [[ -f "$DATA_DIR/text_10m.txt" ]]; then
                run_bench "passthrough 10MB" \
                  "$GNU_BIN '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$RUST_BIN '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$ASM_BIN '$DATA_DIR/text_10m.txt' > /dev/null"
                run_bench "-n 10MB" \
                  "$GNU_BIN -n '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$RUST_BIN -n '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$ASM_BIN -n '$DATA_DIR/text_10m.txt' > /dev/null"
              fi
              ;;
            seq)
              run_bench "1 to 1M" \
                "$GNU_BIN 1000000 > /dev/null" \
                "$RUST_BIN 1000000 > /dev/null" \
                "$ASM_BIN 1000000 > /dev/null"
              run_bench "1 to 10M" \
                "$GNU_BIN 10000000 > /dev/null" \
                "$RUST_BIN 10000000 > /dev/null" \
                "$ASM_BIN 10000000 > /dev/null"
              ;;
            nl)
              if [[ -f "$DATA_DIR/text_10m.txt" ]]; then
                run_bench "10MB text" \
                  "$GNU_BIN '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$RUST_BIN '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$ASM_BIN '$DATA_DIR/text_10m.txt' > /dev/null"
              fi
              ;;
            expand)
              if [[ -f "$DATA_DIR/text_10m.txt" ]]; then
                run_bench "10MB text" \
                  "$GNU_BIN '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$RUST_BIN '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$ASM_BIN '$DATA_DIR/text_10m.txt' > /dev/null"
              fi
              ;;
            unexpand)
              if [[ -f "$DATA_DIR/text_10m.txt" ]]; then
                run_bench "10MB text" \
                  "$GNU_BIN '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$RUST_BIN '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$ASM_BIN '$DATA_DIR/text_10m.txt' > /dev/null"
              fi
              ;;
            fold)
              if [[ -f "$DATA_DIR/text_10m.txt" ]]; then
                run_bench "10MB default width" \
                  "$GNU_BIN '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$RUST_BIN '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$ASM_BIN '$DATA_DIR/text_10m.txt' > /dev/null"
                run_bench "10MB -w 40" \
                  "$GNU_BIN -w 40 '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$RUST_BIN -w 40 '$DATA_DIR/text_10m.txt' > /dev/null" \
                  "$ASM_BIN -w 40 '$DATA_DIR/text_10m.txt' > /dev/null"
              fi
              ;;
            uniq)
              if [[ -f "$DATA_DIR/text_10m.txt" ]]; then
                sort "$DATA_DIR/text_10m.txt" > /tmp/asm_bench_sorted.txt
                run_bench "10MB sorted" \
                  "$GNU_BIN /tmp/asm_bench_sorted.txt > /dev/null" \
                  "$RUST_BIN /tmp/asm_bench_sorted.txt > /dev/null" \
                  "$ASM_BIN /tmp/asm_bench_sorted.txt > /dev/null"
                rm -f /tmp/asm_bench_sorted.txt
              fi
              ;;
            od)
              run_bench "1MB text" \
                "$GNU_BIN '$DATA_DIR/text_1m.txt' > /dev/null" \
                "$RUST_BIN '$DATA_DIR/text_1m.txt' > /dev/null" \
                "$ASM_BIN '$DATA_DIR/text_1m.txt' > /dev/null"
              ;;
            sort)
              run_bench "1MB text" \
                "$GNU_BIN '$DATA_DIR/text_1m.txt' > /dev/null" \
                "$RUST_BIN '$DATA_DIR/text_1m.txt' > /dev/null" \
                "$ASM_BIN '$DATA_DIR/text_1m.txt' > /dev/null"
              ;;
          esac

          # Measure sizes
          gnu_size=0; rust_size=0; asm_size=0
          gnu_path=$(which "$GNU_BIN" 2>/dev/null || echo "")
          [[ -n "$gnu_path" ]] && gnu_size=$(stat -c%s "$gnu_path" 2>/dev/null || echo 0)
          [[ -f "$RUST_BIN" ]] && rust_size=$(stat -c%s "$RUST_BIN" 2>/dev/null || echo 0)
          [[ -f "$ASM_BIN" ]] && asm_size=$(stat -c%s "$ASM_BIN" 2>/dev/null || echo 0)

          cat > "results/asm_bench_${TOOL}.json" <<EOJSON
          {
              "tool": "$TOOL",
              "platform": "$(uname -s)_$(uname -m)",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "warmup": 3,
              "runs": 10,
              "benchmarks": $BENCH_RESULTS,
              "sizes": {
                  "gnu_bytes": $gnu_size,
                  "rust_bytes": $rust_size,
                  "asm_bytes": $asm_size
              }
          }
          EOJSON
        continue-on-error: true
        env:
          RESULTS_DIR: ${{ github.workspace }}/results

      - name: Upload result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asm-bench-${{ matrix.tool }}
          path: results/asm_bench_${{ matrix.tool }}.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 9: Report — aggregate all results and publish
  # ─────────────────────────────────────────────────────────────────────────────
  report:
    name: Publish Report
    runs-on: ubuntu-latest
    needs: [compat, bench, setup, functional, asm-compat, asm-security, asm-bench]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all compatibility results
        uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          path: results/compat-raw/
          merge-multiple: true
        continue-on-error: true

      - name: Download all benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: results/bench-raw/
          merge-multiple: true
        continue-on-error: true

      - name: Download sizes
        uses: actions/download-artifact@v4
        with:
          name: sizes
          path: results/
        continue-on-error: true

      - name: Download assembly sizes
        uses: actions/download-artifact@v4
        with:
          name: asm-sizes
          path: results/
        continue-on-error: true

      - name: Download assembly compat results
        uses: actions/download-artifact@v4
        with:
          pattern: asm-compat-*
          path: results/asm-compat-raw/
          merge-multiple: true
        continue-on-error: true

      - name: Download assembly security results
        uses: actions/download-artifact@v4
        with:
          pattern: asm-security-*
          path: results/asm-security-raw/
          merge-multiple: true
        continue-on-error: true

      - name: Download assembly benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: asm-bench-*
          path: results/asm-bench-raw/
          merge-multiple: true
        continue-on-error: true

      - name: Download functional-linux-arm64
        uses: actions/download-artifact@v4
        with:
          name: functional-linux-arm64
          path: results/compatibility/${{ inputs.version }}/
        continue-on-error: true

      - name: Download functional-macos-arm64
        uses: actions/download-artifact@v4
        with:
          name: functional-macos-arm64
          path: results/compatibility/${{ inputs.version }}/
        continue-on-error: true

      - name: Download functional-windows-x86_64
        uses: actions/download-artifact@v4
        with:
          name: functional-windows-x86_64
          path: results/compatibility/${{ inputs.version }}/
        continue-on-error: true

      - name: Download functional-windows-arm64
        uses: actions/download-artifact@v4
        with:
          name: functional-windows-arm64
          path: results/compatibility/${{ inputs.version }}/
        continue-on-error: true

      - name: Aggregate compatibility results
        run: |
          python3 - <<'PYEOF'
          import json, glob, os
          from datetime import datetime, timezone

          results_dir = "results/compat-raw"
          tool_details = {}
          total_passed = 0
          total_failed = 0
          total_skipped = 0
          total_run = 0
          tools_tested = 0
          tools_skipped = 0

          for f in sorted(glob.glob(os.path.join(results_dir, "*_results.json"))):
              tool_name = os.path.basename(f).replace("_results.json", "")
              try:
                  data = json.load(open(f))
              except Exception as e:
                  tool_details[tool_name] = {
                      "status": "error", "error": str(e),
                      "total": 0, "passed": 0, "failed": 0, "skipped": 0,
                      "failed_tests": []
                  }
                  continue

              status = data.get("status", "")
              if status == "NOT_IMPLEMENTED":
                  tool_details[tool_name] = {
                      "status": "NOT_IMPLEMENTED",
                      "total": 0, "passed": 0, "failed": 0, "skipped": 0,
                      "failed_tests": []
                  }
                  tools_skipped += 1
              else:
                  s = data.get("summary", {})
                  passed = s.get("passed", 0)
                  failed = s.get("failed", 0)
                  skipped = s.get("skipped", 0)
                  total = s.get("total", 0)
                  total_passed += passed
                  total_failed += failed
                  total_skipped += skipped
                  total_run += total
                  tools_tested += 1
                  failed_tests = []
                  for t in data.get("tests", []):
                      if t.get("status") == "FAIL" or t.get("f_status") == "FAIL":
                          failed_tests.append(t.get("name", "?"))
                  tool_details[tool_name] = {
                      "status": "tested",
                      "total": total, "passed": passed,
                      "failed": failed, "skipped": skipped,
                      "failed_tests": failed_tests
                  }

          version = os.environ["VERSION"]
          aggregate = {
              "type": "compatibility",
              "platform": "Linux_x86_64",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "summary": {
                  "total_tests": total_run,
                  "passed": total_passed,
                  "failed": total_failed,
                  "skipped": total_skipped,
                  "tools_tested": tools_tested,
                  "tools_skipped": tools_skipped
              },
              "tools": tool_details
          }

          out_dir = f"results/compatibility/{version}"
          os.makedirs(out_dir, exist_ok=True)
          with open(f"{out_dir}/linux_x86_64.json", "w") as f:
              json.dump(aggregate, f, indent=2)
          print(f"Aggregated {tools_tested + tools_skipped} tool results into {out_dir}/linux_x86_64.json")
          PYEOF
        env:
          VERSION: ${{ inputs.version }}

      - name: Aggregate benchmark results
        run: |
          python3 - <<'PYEOF'
          import json, glob, os, shutil
          from datetime import datetime, timezone

          results_dir = "results/bench-raw"
          tools = {}

          for f in sorted(glob.glob(os.path.join(results_dir, "*_benchmark.json"))):
              try:
                  data = json.load(open(f))
                  tool = data.get("tool", "")
                  if tool:
                      tools[tool] = data
              except Exception:
                  pass

          version = os.environ["VERSION"]
          aggregate = {
              "type": "benchmark",
              "platform": "Linux_x86_64",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "tools": tools
          }

          out_dir = f"results/benchmarks/{version}"
          os.makedirs(out_dir, exist_ok=True)
          with open(f"{out_dir}/linux_x86_64.json", "w") as f:
              json.dump(aggregate, f, indent=2)

          # Copy sizes if available
          if os.path.exists("results/sizes.json"):
              shutil.copy("results/sizes.json", f"{out_dir}/linux_x86_64_sizes.json")

          print(f"Aggregated {len(tools)} benchmark results into {out_dir}/linux_x86_64.json")
          PYEOF
        env:
          VERSION: ${{ inputs.version }}

      - name: Aggregate assembly results
        run: |
          python3 - <<'PYEOF'
          import json, glob, os
          from datetime import datetime, timezone

          version = os.environ["VERSION"]

          # ── Assembly compatibility ──
          asm_compat = {}
          for f in sorted(glob.glob("results/asm-compat-raw/asm_compat_*.json")):
              try:
                  data = json.load(open(f))
                  tool = data.get("tool", "")
                  if tool:
                      asm_compat[tool] = data
              except Exception:
                  pass

          # ── Assembly security ──
          asm_security = {}
          for f in sorted(glob.glob("results/asm-security-raw/asm_security_*.json")):
              try:
                  data = json.load(open(f))
                  tool = data.get("tool", "")
                  if tool:
                      asm_security[tool] = data
              except Exception:
                  pass

          # ── Assembly benchmarks ──
          asm_bench = {}
          for f in sorted(glob.glob("results/asm-bench-raw/asm_bench_*.json")):
              try:
                  data = json.load(open(f))
                  tool = data.get("tool", "")
                  if tool:
                      asm_bench[tool] = data
              except Exception:
                  pass

          # ── Assembly sizes ──
          asm_sizes = {}
          if os.path.exists("results/asm_sizes.json"):
              try:
                  asm_sizes = json.load(open("results/asm_sizes.json")).get("sizes", {})
              except Exception:
                  pass

          # ── Aggregate ──
          aggregate = {
              "type": "assembly",
              "platform": "Linux_x86_64",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "compatibility": asm_compat,
              "security": asm_security,
              "benchmarks": asm_bench,
              "sizes": asm_sizes,
          }

          out_dir = f"results/assembly/{version}"
          os.makedirs(out_dir, exist_ok=True)
          with open(f"{out_dir}/linux_x86_64.json", "w") as f:
              json.dump(aggregate, f, indent=2)

          print(f"Assembly results aggregated: "
                f"{len(asm_compat)} compat, "
                f"{len(asm_security)} security, "
                f"{len(asm_bench)} bench")
          PYEOF
        env:
          VERSION: ${{ inputs.version }}

      - name: Install Python dependencies
        run: pip install matplotlib

      - name: Generate README (main compatibility table)
        run: python scripts/generate_report.py
        continue-on-error: true

      - name: Generate speedup chart
        run: python scripts/plot_speedup.py
        continue-on-error: true

      - name: Append multi-platform section to README
        run: |
          python3 - <<'PYEOF'
          import json, os, re

          version = os.environ["VERSION"]
          base    = f"results/compatibility/{version}"

          platforms = [
              ("Linux x86_64",  "linux_x86_64.json"),
              ("Linux ARM64",   "linux_aarch64.json"),
              ("macOS ARM64",   "darwin_arm64.json"),
              ("Windows x86_64","windows_x86_64.json"),
              ("Windows ARM64", "windows_arm64.json"),
          ]

          rows = []
          for label, fname in platforms:
              path = os.path.join(base, fname)
              if not os.path.exists(path):
                  rows.append(f"| {label} | — | — | — | ⏭️ missing |")
                  continue
              data = json.load(open(path))
              if data.get("skipped"):
                  reason = data.get("reason", "no binary available")
                  rows.append(f"| {label} | — | — | — | ⏭️ {reason} |")
                  continue
              if data.get("smoke_only"):
                  reason = data.get("reason", "smoke test only")
                  rows.append(f"| {label} | — | — | — | 🔍 {reason} |")
                  continue
              s       = data.get("summary", {})
              passed  = s.get("passed", 0)
              failed  = s.get("failed", 0)
              skipped = s.get("skipped", 0)
              total   = passed + failed + skipped
              if total == 0:
                  status = "⏭️ no tests ran"
              elif failed == 0:
                  status = "✅"
              else:
                  status = "⚠️"
              rows.append(f"| {label} | {passed} | {failed} | {skipped} | {status} |")

          section = f"""## Platform Functional Tests ({version})

          | Platform | Passed | Failed | Skipped | Status |
          |----------|--------|--------|---------|--------|
          """ + "\n".join(rows) + "\n"

          section = "\n".join(line.strip() for line in section.splitlines()) + "\n"

          readme = "README.md"
          if not os.path.exists(readme):
              with open(readme, "w") as f:
                  f.write(section)
          else:
              content = open(readme).read()
              pattern = r"## Platform Functional Tests \(.*?\)\n[\s\S]*?(?=\n##|\Z)"
              if re.search(pattern, content):
                  content = re.sub(pattern, section.rstrip(), content)
              else:
                  content = content.rstrip() + "\n\n" + section
              with open(readme, "w") as f:
                  f.write(content)
          print(f"README.md updated with platform section for {version}.")
          PYEOF
        env:
          VERSION: ${{ inputs.version }}

      - name: Commit and push results
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "results/compatibility/$VERSION/" \
                  "results/benchmarks/$VERSION/" \
                  "results/assembly/$VERSION/" \
                  results/speedup-history.png \
                  README.md

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update test report $VERSION"
